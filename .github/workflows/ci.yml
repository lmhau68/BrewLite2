name: CI

# Pipeline chạy khi mở Pull Request và khi push lên nhánh chính.
# Thứ tự: Install → Lint → Unit Test → Build. PR không được merge nếu bước nào lỗi.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — Lint, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brewlite -d brewlite_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Integration Test (Orders & Payments)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://brewlite:brewlite@localhost:5432/brewlite_test
          JWT_SECRET: brewlite-ci-integration-test-jwt-secret-key-2026

      - name: Build
        run: npm run build

  web:
    name: Web — Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker — Build và kiểm tra khởi động
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_docker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brewlite -d brewlite_docker_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          platforms: linux/amd64
          load: true
          push: false
          tags: brewlite-api:ci

      - name: Build image Web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          platforms: linux/amd64
          load: true
          push: false
          tags: brewlite-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:10000

      - name: Khởi động container theo cấu hình Render Free
        run: |
          set -euo pipefail
          # Container kết nối PostgreSQL tạm của job qua mạng host trên runner Linux.
          # Chỉ dùng thông tin đăng nhập kiểm thử, không dùng secret production.
          docker run --detach --name brewlite-api-ci --network host \
            -e DATABASE_URL=postgres://brewlite:brewlite@127.0.0.1:5432/brewlite_docker_test \
            -e JWT_SECRET=brewlite-ci-docker-test-secret-at-least-32-characters \
            -e DB_MIGRATIONS_RUN=false \
            -e CORS_ORIGIN=http://127.0.0.1:10001 \
            -e PORT=10000 \
            brewlite-api:ci /bin/sh /app/start-render.sh
          docker run --detach --name brewlite-web-ci --network host \
            -e PORT=10001 brewlite-web:ci

      - name: Kiểm tra health và dữ liệu seed
        run: |
          set -euo pipefail
          wait_for_http_200() {
            url="$1"
            for attempt in $(seq 1 60); do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 5 "$url" || true)
              if [ "$status" = '200' ]; then
                return 0
              fi
              sleep 2
            done
            echo "::error::Container không trả về HTTP 200: $url"
            return 1
          }
          wait_for_http_200 http://127.0.0.1:10000/health
          wait_for_http_200 http://127.0.0.1:10001/
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:10000/products | jq -e 'type == "array" and length > 0'
          # Chạy lại bước chuẩn bị để kiểm tra khả năng khởi động với catalog đã có.
          docker exec brewlite-api-ci node dist/database/prepare-production.js

      - name: Hiển thị log container khi kiểm tra thất bại
        if: failure()
        run: |
          docker logs brewlite-api-ci || true
          docker logs brewlite-web-ci || true

      - name: Dọn dẹp container kiểm thử
        if: always()
        run: docker rm --force brewlite-api-ci brewlite-web-ci || true
