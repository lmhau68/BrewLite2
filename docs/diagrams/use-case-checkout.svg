<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Use-case đặt đơn và thanh toán BrewLite</title>
  <desc id="desc">Khách hàng đặt đơn hàng UC-04, bao gồm thanh toán đơn hàng mô phỏng UC-05. Đơn vị thanh toán Mock tương tác với UC-05.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#333" />
    </marker>
  </defs>
  <rect x="155" y="28" width="690" height="205" rx="3" fill="#fff" stroke="#333" stroke-width="1.5" />
  <text x="500" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Đặt đơn và thanh toán</text>

  <g stroke="#333" stroke-width="1.5" fill="none" font-family="Arial, sans-serif">
    <circle cx="65" cy="102" r="11" />
    <path d="M65 113v39 M45 126h40 M65 152l-18 24 M65 152l18 24" />
    <circle cx="1025" cy="102" r="11" />
    <path d="M1025 113v39 M1005 126h40 M1025 152l-18 24 M1025 152l18 24" />
    <line x1="90" y1="135" x2="286" y2="135" />
    <line x1="805" y1="135" x2="1000" y2="135" />
    <ellipse cx="390" cy="135" rx="105" ry="47" fill="#f7f7f7" />
    <ellipse cx="680" cy="135" rx="125" ry="47" fill="#f7f7f7" />
    <line x1="495" y1="135" x2="546" y2="135" stroke-dasharray="7 5" marker-end="url(#arrow)" />
  </g>
  <g font-family="Arial, sans-serif" fill="#222" text-anchor="middle">
    <text x="65" y="198" font-size="15">Khách hàng</text>
    <text x="1025" y="198" font-size="15">Đơn vị thanh toán</text>
    <text x="1025" y="217" font-size="14">(Mock)</text>
    <text x="390" y="129" font-size="15">UC-04</text>
    <text x="390" y="150" font-size="15">Đặt đơn hàng</text>
    <text x="680" y="129" font-size="15">UC-05</text>
    <text x="680" y="150" font-size="15">Thanh toán đơn hàng mô phỏng</text>
    <text x="520" y="119" font-size="13">&lt;&lt;include&gt;&gt;</text>
  </g>
</svg>
